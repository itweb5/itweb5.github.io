<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航 | My Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg: #0f0f1a;
            --bg2: #1a1a2e;f
            --card: #1e1e36;
            --card-hover: #252548;
            --text: #e0e0f0;
            --text-secondary: #8888aa;
            --border: #2a2a4a;
            --primary: #00B894;
            --primary-glow: rgba(0, 184, 148, 0.3);
            --accent: #FF6B35;
            --radius: 16px;
            --blur: blur(20px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 动态背景 ===== */
        .bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.4;
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 184, 148, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 107, 53, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(155, 89, 182, 0.06) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
        }
        @keyframes bgFloat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }

        .container {
            position: relative; z-index: 1;
            max-width: 1200px; margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 40px; flex-wrap: wrap; gap: 16px;
        }
        .logo {
            display: flex; align-items: center; gap: 12px;
        }
        .logo-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #00d2a8);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .logo-text {
            font-size: 20px; font-weight: 700; letter-spacing: 0.5px;
        }
        .logo-text span { color: var(--primary); }

        .top-actions { display: flex; gap: 10px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--text); border-color: var(--primary); transform: translateY(-2px); }

        /* ===== 搜索栏 ===== */
        .search-section {
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 48px;
        }
        .greeting {
            font-size: 14px; color: var(--text-secondary); margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .greeting .time { font-weight: 600; color: var(--primary); }

        .search-box {
            position: relative; width: 100%; max-width: 600px;
        }
        .search-input {
            width: 100%; padding: 16px 20px 16px 52px;
            border-radius: 16px; border: 1px solid var(--border);
            background: var(--card); color: var(--text);
            font-size: 16px; outline: none;
            transition: all 0.3s;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .search-icon {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px; opacity: 0.5;
        }
        .search-engine {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            display: flex; gap: 4px;
        }
        .engine-btn {
            padding: 6px 12px; border-radius: 8px;
            background: transparent; border: none; cursor: pointer;
            color: var(--text-secondary); font-size: 12px;
            transition: all 0.2s;
        }
        .engine-btn.active { background: var(--primary); color: white; }
        .engine-btn:hover:not(.active) { color: var(--text); }

        /* ===== 模块分区 ===== */
        .section { margin-bottom: 36px; }
        .section-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px; padding: 0 4px;
        }
        .section-title {
            font-size: 15px; font-weight: 600; color: var(--text-secondary);
            display: flex; align-items: center; gap: 8px;
        }
        .section-line {
            flex: 1; height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
        }
        .section-add {
            width: 28px; height: 28px; border-radius: 8px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: all 0.2s;
        }
        .section-add:hover { color: var(--primary); border-color: var(--primary); }

        /* ===== 工具网格 ===== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .tool-card {
            position: relative; padding: 20px;
            border-radius: var(--radius);
            background: var(--card); border: 1px solid var(--border);
            cursor: pointer; text-decoration: none; color: var(--text);
            transition: all 0.3s; overflow: hidden;
            display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
        }
        .tool-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 3px; background: var(--tool-color, var(--primary));
            transform: scaleX(0); transform-origin: left; transition: transform 0.3s;
        }
        .tool-card:hover::before { transform: scaleX(1); }
        .tool-card:hover {
            background: var(--card-hover);
            border-color: var(--tool-color, var(--primary));
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .tool-card.highlight {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--card) 0%, var(--card-hover) 100%);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        @media (max-width: 640px) {
            .tool-card.highlight { grid-column: span 1; }
        }

        .tool-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            background: var(--tool-color, var(--primary));
            color: white;
        }
        .tool-info { flex: 1; }
        .tool-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .tool-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

        .tool-badge {
            position: absolute; top: 12px; right: 12px;
            padding: 2px 8px; border-radius: 20px;
            background: var(--accent); color: white;
            font-size: 10px; font-weight: 600;
        }

        .tool-delete {
            position: absolute; top: 8px; right: 8px;
            width: 22px; height: 22px; border-radius: 6px;
            background: var(--bg2); border: 1px solid var(--border);
            color: var(--text-secondary); cursor: pointer;
            display: none; align-items: center; justify-content: center;
            font-size: 12px; z-index: 2;
        }
        .edit-mode .tool-delete { display: flex; }
        .tool-card.editing { opacity: 0.7; cursor: default; pointer-events: none; }
        .edit-mode .tool-card.editing { pointer-events: auto; }
        .tool-card.editing .tool-delete { display: flex; }

        /* ===== 添加卡片 ===== */
        .add-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; border: 2px dashed var(--border);
            background: transparent; min-height: 120px;
        }
        .add-card:hover { border-color: var(--primary); background: var(--card); }
        .add-card .tool-icon { background: transparent; border: 2px dashed var(--border); color: var(--text-secondary); }
        .add-card:hover .tool-icon { border-color: var(--primary); color: var(--primary); }
        .add-card .tool-name { color: var(--text-secondary); }
        .add-card:hover .tool-name { color: var(--primary); }

        /* ===== 快捷链接 ===== */
        .links-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .link-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 10px;
            background: var(--card); border: 1px solid var(--border);
            text-decoration: none; color: var(--text); font-size: 13px;
            white-space: nowrap; cursor: pointer; transition: all 0.2s;
            flex-shrink: 0;
        }
        .link-item:hover { border-color: var(--primary); background: var(--card-hover); }
        .link-favicon { width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }

        /* ===== 底部 ===== */
        .footer {
            text-align: center; padding: 32px 0 0; margin-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px; color: var(--text-secondary);
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: var(--blur); z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 28px; width: 100%; max-width: 460px;
            animation: slideUp 0.3s;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: block; font-weight: 500; }
        .form-input {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg2);
            color: var(--text); font-size: 14px; outline: none; transition: border 0.2s;
        }
        .form-input:focus { border-color: var(--primary); }
        .icon-picker { display: flex; flex-wrap: wrap; gap: 6px; }
        .icon-option {
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; border: 2px solid transparent;
            background: var(--bg2); transition: all 0.2s;
        }
        .icon-option:hover { border-color: var(--primary); }
        .icon-option.selected { border-color: var(--primary); background: var(--primary-glow); }
        .color-picker { display: flex; flex-wrap: wrap; gap: 8px; }
        .color-option {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: all 0.2s;
        }
        .color-option.selected { border-color: white; transform: scale(1.15); }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn { padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; flex: 1; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #00a883; }
        .btn-secondary { background: var(--bg2); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { color: var(--text); }

        /* ===== Toast ===== */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 12px 24px; border-radius: 12px;
            font-size: 14px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            animation: toastIn 0.3s;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container { padding: 16px 12px 32px; }
            .search-section { margin-bottom: 32px; }
            .tools-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .tool-card { padding: 14px; }
            .tool-icon { width: 38px; height: 38px; font-size: 18px; }
            .top-bar { margin-bottom: 28px; }
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>

<canvas class="bg-canvas" id="bgCanvas"></canvas>
<div class="bg-gradient"></div>

<div class="container">
    <!-- 顶部栏 -->
    <header class="top-bar">
        <div class="logo">
            <div class="logo-icon">🌐</div>
            <div class="logo-text">我的<span>导航</span></div>
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="editToggle" title="编辑模式">✏️</button>
            <button class="icon-btn" id="themeToggle" title="切换主题" style="display:none">🌙</button>
        </div>
    </header>

    <!-- 搜索区 -->
    <section class="search-section">
        <div class="greeting" id="greeting"></div>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索或输入网址..." autocomplete="off">
            <div class="search-engine" id="engineBtns">
                <button class="engine-btn active" data-engine="google">Google</button>
                <button class="engine-btn" data-engine="bing">Bing</button>
                <button class="engine-btn" data-engine="baidu">百度</button>
            </div>
        </div>
    </section>

    <!-- 工具/应用区 -->
    <section class="section" id="toolsSection">
        <div class="section-header">
            <div class="section-title">🧩 我的工具</div>
            <div class="section-line"></div>
        </div>
        <div class="tools-grid" id="toolsGrid"></div>
    </section>

    <!-- 快捷链接区 -->
    <section class="section" id="linksSection">
        <div class="section-header">
            <div class="section-title">🔗 快捷链接</div>
            <div class="section-line"></div>
            <button class="section-add" id="addLinkBtn" title="添加链接">+</button>
        </div>
        <div class="links-row" id="linksRow"></div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
        <p>🌿 我的导航 · 数据保存在本地浏览器 · <span id="dataCount">0</span> 个工具</p>
    </footer>
</div>

<script>
// ===================== 数据存储 =====================
const STORAGE_KEY = 'myhub_data';

const defaultData = {
    tools: [
        {
            id: 'discipline',
            name: '自律追踪',
            desc: '习惯打卡 · 每日记录 · 感想日记 · 数据分析',
            icon: '🌿',
            color: '#00B894',
            url: 'https://itweb5.github.io/discipline-tracker/',
            highlight: true,
            badge: '核心'
        }
    ],
    links: [
        { name: 'GitHub', url: 'https://github.com', favicon: '🐙' },
        { name: 'YouTube', url: 'https://youtube.com', favicon: '▶️' },
        { name: 'ChatGPT', url: 'https://chat.openai.com', favicon: '🤖' },
        { name: '知乎', url: 'https://zhihu.com', favicon: '知' },
        { name: 'B站', url: 'https://bilibili.com', favicon: '📺' },
        { name: '微博', url: 'https://weibo.com', favicon: '📱' },
    ],
    settings: {
        searchEngine: 'google',
        userName: ''
    }
};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || JSON.parse(JSON.stringify(defaultData));

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// ===================== 搜索引擎 =====================
const ENGINES = {
    google: 'https://www.google.com/search?q=',
    bing: 'https://www.bing.com/search?q=',
    baidu: 'https://www.baidu.com/s?wd='
};

let currentEngine = data.settings.searchEngine || 'google';

// ===================== 工具管理 =====================
const ICONS = ['🌿','📝','📊','💪','🎯','📚','🏃','💧','🧘','🎨','🎵','💻','🔧','📰','💰','🎮','🍕','🛒','✈️','📷','🔍','📅','⏰','🌦️','📚','🎬','📮','💡','🔥','⭐','🌈','🚀'];
const COLORS = ['#00B894','#FF6B35','#4A90D9','#9B59B6','#F39C12','#E74C3C','#1ABC9C','#3498DB','#2ECC71','#E91E63','#00BCD4','#FF1744'];

function renderTools() {
    const grid = document.getElementById('toolsGrid');
    grid.innerHTML = '';

    data.tools.forEach(tool => {
        const card = document.createElement('a');
        card.className = 'tool-card' + (tool.highlight ? ' highlight' : '');
        card.style.setProperty('--tool-color', tool.color);
        card.href = tool.url;
        card.target = '_blank';
        card.dataset.id = tool.id;
        card.innerHTML = `
            <button class="tool-delete" onclick="event.preventDefault();event.stopPropagation();deleteTool('${tool.id}')">✕</button>
            ${tool.badge ? `<span class="tool-badge">${tool.badge}</span>` : ''}
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-info">
                <div class="tool-name">${tool.name}</div>
                <div class="tool-desc">${tool.desc || ''}</div>
            </div>
        `;
        // 编辑模式下禁止跳转
        card.addEventListener('click', (e) => {
            if (isEditMode) { e.preventDefault(); editTool(tool.id); }
        });
        grid.appendChild(card);
    });

    // 添加按钮
    const addCard = document.createElement('div');
    addCard.className = 'tool-card add-card';
    addCard.innerHTML = `
        <div class="tool-icon">＋</div>
        <div class="tool-name">添加工具</div>
    `;
    addCard.addEventListener('click', () => openToolModal());
    grid.appendChild(addCard);

    updateDataCount();
}

function renderLinks() {
    const row = document.getElementById('linksRow');
    row.innerHTML = '';
    data.links.forEach((link, idx) => {
        const item = document.createElement('a');
        item.className = 'link-item';
        item.href = link.url;
        item.target = '_blank';
        const faviconUrl = link.favicon && link.favicon.length === 1 
            ? null  // 单字符用文字
            : link.favicon && link.favicon.startsWith('http') 
                ? link.favicon 
                : null;
        const faviconContent = faviconUrl 
            ? `<img class="link-favicon" src="${faviconUrl}" onerror="this.style.display='none'">`
            : `<span style="font-size:14px">${link.favicon || '🔗'}</span>`;
        item.innerHTML = `
            ${faviconContent}
            <span>${link.name}</span>
            ${isEditMode ? `<span class="tool-delete" style="position:relative;display:inline-flex;width:18px;height:18px;font-size:10px" onclick="event.preventDefault();event.stopPropagation();deleteLink(${idx})">✕</span>` : ''}
        `;
        row.appendChild(item);
    });
}

function updateDataCount() {
    document.getElementById('dataCount').textContent = data.tools.length;
}

// ===================== 删除功能 =====================
function deleteTool(id) {
    if (!confirm('确定删除这个工具？')) return;
    data.tools = data.tools.filter(t => t.id !== id);
    save(); renderTools();
    showToast('已删除');
}
function deleteLink(idx) {
    data.links.splice(idx, 1);
    save(); renderLinks();
    showToast('已删除');
}

// ===================== 编辑模式 =====================
let isEditMode = false;
document.getElementById('editToggle').addEventListener('click', () => {
    isEditMode = !isEditMode;
    document.body.classList.toggle('edit-mode', isEditMode);
    document.getElementById('editToggle').style.color = isEditMode ? 'var(--primary)' : '';
    document.getElementById('editToggle').style.borderColor = isEditMode ? 'var(--primary)' : '';
    renderTools(); renderLinks();
});

// ===================== 工具弹窗 =====================
let editingToolId = null;
let selectedIcon = '🌿';
let selectedColor = '#00B894';

function openToolModal(toolId = null) {
    editingToolId = toolId;
    const tool = toolId ? data.tools.find(t => t.id === toolId) : null;
    selectedIcon = tool ? tool.icon : '🌿';
    selectedColor = tool ? tool.color : '#00B894';

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'toolModal';
    modal.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title">${toolId ? '编辑工具' : '添加工具'}</div>
            <div class="form-group">
                <label class="form-label">名称</label>
                <input class="form-input" id="tool-name-input" placeholder="如：自律追踪" value="${tool ? tool.name : ''}">
            </div>
            <div class="form-group">
                <label class="form-label">描述</label>
                <input class="form-input" id="tool-desc-input" placeholder="一句话描述" value="${tool ? tool.desc || '' : ''}">
            </div>
            <div class="form-group">
                <label class="form-label">网址 (URL)</label>
                <input class="form-input" id="tool-url-input" placeholder="https://..." value="${tool ? tool.url : ''}">
            </div>
            <div class="form-group">
                <label class="form-label">图标</label>
                <div class="icon-picker" id="iconPicker">
                    ${ICONS.map(icon => `<div class="icon-option ${icon === selectedIcon ? 'selected' : ''}" data-icon="${icon}">${icon}</div>`).join('')}
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">颜色</label>
                <div class="color-picker" id="colorPicker">
                    ${COLORS.map(c => `<div class="color-option ${c === selectedColor ? 'selected' : ''}" data-color="${c}" style="background:${c}"></div>`).join('')}
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">
                    <input type="checkbox" id="tool-highlight" ${tool && tool.highlight ? 'checked' : ''} style="width:auto;margin-right:6px">
                    设为核心工具（大卡片展示）
                </label>
            </div>
            <div class="form-group">
                <label class="form-label">徽章文字（可选）</label>
                <input class="form-input" id="tool-badge-input" placeholder="如：核心、新" value="${tool ? tool.badge || '' : ''}">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeToolModal()">取消</button>
                <button class="btn btn-primary" onclick="saveTool()">保存</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    bindPickerEvents();
}

function bindPickerEvents() {
    document.querySelectorAll('#iconPicker .icon-option').forEach(el => {
        el.onclick = () => {
            document.querySelectorAll('#iconPicker .icon-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedIcon = el.dataset.icon;
        };
    });
    document.querySelectorAll('#colorPicker .color-option').forEach(el => {
        el.onclick = () => {
            document.querySelectorAll('#colorPicker .color-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedColor = el.dataset.color;
        };
    });
}

function closeToolModal() { document.getElementById('toolModal').remove(); }

function saveTool() {
    const name = document.getElementById('tool-name-input').value.trim();
    const desc = document.getElementById('tool-desc-input').value.trim();
    let url = document.getElementById('tool-url-input').value.trim();
    const highlight = document.getElementById('tool-highlight').checked;
    const badge = document.getElementById('tool-badge-input').value.trim();
    if (!name) { showToast('请输入名称'); return; }
    if (!url) { showToast('请输入网址'); return; }
    if (!url.startsWith('http')) url = 'https://' + url;

    if (editingToolId) {
        const tool = data.tools.find(t => t.id === editingToolId);
        if (tool) Object.assign(tool, { name, desc, url, icon: selectedIcon, color: selectedColor, highlight, badge });
    } else {
        data.tools.push({ id: 't' + Date.now(), name, desc, url, icon: selectedIcon, color: selectedColor, highlight, badge });
    }
    save(); closeToolModal(); renderTools();
    showToast(editingToolId ? '已更新' : '已添加');
}

function editTool(id) { openToolModal(id); }

// ===================== 链接弹窗 =====================
function openLinkModal() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'linkModal';
    modal.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title">添加快捷链接</div>
            <div class="form-group">
                <label class="form-label">名称</label>
                <input class="form-input" id="link-name-input" placeholder="如：GitHub">
            </div>
            <div class="form-group">
                <label class="form-label">网址</label>
                <input class="form-input" id="link-url-input" placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="form-label">图标（emoji 或 图片URL）</label>
                <input class="form-input" id="link-favicon-input" placeholder="🐙 或留空自动获取">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeLinkModal()">取消</button>
                <button class="btn btn-primary" onclick="saveLink()">添加</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}
function closeLinkModal() { document.getElementById('linkModal').remove(); }
function saveLink() {
    const name = document.getElementById('link-name-input').value.trim();
    let url = document.getElementById('link-url-input').value.trim();
    let favicon = document.getElementById('link-favicon-input').value.trim();
    if (!name || !url) { showToast('请填写名称和网址'); return; }
    if (!url.startsWith('http')) url = 'https://' + url;
    if (!favicon) { favicon = '🔗'; }
    // 如果没有提供favicon，尝试用Google的favicon服务
    if (favicon && !favicon.startsWith('http') && favicon.length > 2) {
        // 用户输入了文字，保持文字
    } else if (!favicon.startsWith('http')) {
        favicon = `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=32`;
    }
    data.links.push({ name, url, favicon });
    save(); closeLinkModal(); renderLinks();
    showToast('已添加');
}

// ===================== 搜索功能 =====================
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (!query) return;
        // 如果输入的是网址，直接跳转
        if (/^https?:\/\//.test(query)) { window.open(query, '_blank'); return; }
        if (/^[\w-]+\.[\w-]+/.test(query) && !query.includes(' ')) { window.open('https://' + query, '_blank'); return; }
        // 否则搜索
        window.open(ENGINES[currentEngine] + encodeURIComponent(query), '_blank');
    }
});

// 搜索引擎切换
document.getElementById('engineBtns').addEventListener('click', (e) => {
    if (e.target.classList.contains('engine-btn')) {
        document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentEngine = e.target.dataset.engine;
        data.settings.searchEngine = currentEngine;
        save();
    }
});

// 恢复搜索引擎选择
if (data.settings.searchEngine) {
    currentEngine = data.settings.searchEngine;
    document.querySelectorAll('.engine-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.engine === currentEngine);
    });
}

// ===================== 问候语 =====================
function updateGreeting() {
    const now = new Date();
    const h = now.getHours();
    let greeting;
    if (h < 6) greeting = '夜深了';
    else if (h < 11) greeting = '早安';
    else if (h < 14) greeting = '中午好';
    else if (h < 18) greeting = '下午好';
    else if (h < 22) greeting = '晚上好';
    else greeting = '夜深了';

    const time = `${String(h).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const days = ['日', '一', '二', '三', '四', '五', '六'];
    const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 星期${days[now.getDay()]}`;

    document.getElementById('greeting').innerHTML = `${greeting} 👋 · <span class="time">${time}</span> · ${dateStr}`;
}
updateGreeting();
setInterval(updateGreeting, 1000);

// ===================== Toast =====================
function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

// ===================== 添加链接按钮 =====================
document.getElementById('addLinkBtn').addEventListener('click', openLinkModal);

// ===================== 动态粒子背景 =====================
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.r = Math.random() * 2 + 0.5;
        this.opacity = Math.random() * 0.4 + 0.1;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.r), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 184, 148, ${this.opacity})`;
        ctx.fill();
    }
}

for (let i = 0; i < 50; i++) particles.push(new Particle());

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    // 连线
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(0, 184, 148, ${0.08 * (1 - dist / 120)})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}
animate();

// ===================== 初始化渲染 =====================
renderTools();
renderLinks();

// 点击遮罩关闭弹窗
document.addEventListener('click', (e) => {
    if (e.target.classList.contains('modal-overlay')) e.target.remove();
});
