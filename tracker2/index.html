<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 爱心成长记 - 积分自律养成</title>
    <style>
        :root {
            --bg: #fff8e7;
            --card: #ffffff;
            --primary: #ff7b42;
            --secondary: #ffb347;
            --success: #4caf84;
            --info: #5b9bd5;
            --pink: #ff6b9d;
            --purple: #9b59b6;
            --yellow: #ffd93d;
            --text: #4a3728;
            --text-light: #8b7355;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --admin-primary: #7c4dff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 30%, #ffecb3 60%, #fff8e1 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow-x: hidden;
        }
        body.admin-mode {
            background: linear-gradient(135deg, #f8f4ff 0%, #ede7f6 30%, #e8eaf6 60%, #f3e5f5 100%);
        }

        body::before {
            content: ''; position: fixed; top: -180px; right: -120px;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255,183,77,0.25) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; bottom: -150px; left: -100px;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,107,157,0.18) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 0;
        }
        body.admin-mode::before, body.admin-mode::after { opacity: 0.4; }

        .app-container { max-width: 520px; margin: 0 auto; padding: 12px 16px 120px; position: relative; z-index: 1; }

        /* 头部 */
        .header { text-align: center; padding: 20px 16px 12px; position: relative; }
        .header .mascot {
            font-size: 56px; animation: bounce 2s ease-in-out infinite;
            display: inline-block; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            cursor: pointer; transition: transform 0.2s;
        }
        .header .mascot:hover { transform: scale(1.1); }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            30% { transform: translateY(-14px); }
            50% { transform: translateY(0); }
            70% { transform: translateY(-6px); }
        }
        .header h1 {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(135deg, #ff7b42, #ffb347);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin: 4px 0 0; letter-spacing: 1px;
        }
        .admin-mode .header h1 {
            background: linear-gradient(135deg, #7c4dff, #b388ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header .subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }

        .admin-entry {
            position: absolute; top: 8px; right: 8px; font-size: 22px;
            cursor: pointer; opacity: 0.5; transition: opacity 0.2s; z-index: 2;
            background: rgba(255,255,255,0.7); border-radius: 50%;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
        }
        .admin-entry:hover { opacity: 1; }

        /* 提醒条 */
        .reminder-bar {
            background: linear-gradient(135deg, #fff9c4, #fff176);
            border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px; font-size: 13px;
            font-weight: 600; color: #6d5e00; box-shadow: 0 2px 8px rgba(255,217,61,0.2);
        }
        .reminder-bar .bell { font-size: 24px; animation: ring 3s ease-in-out infinite; }
        @keyframes ring {
            0%,85%,100% { transform: rotate(0); }
            88% { transform: rotate(15deg); }
            91% { transform: rotate(-15deg); }
            94% { transform: rotate(8deg); }
            97% { transform: rotate(-5deg); }
        }
        .reminder-bar .reminder-info { flex: 1; font-size: 12px; }
        .reminder-bar .reminder-status {
            font-size: 11px; padding: 4px 10px; border-radius: 12px;
            background: #fff; color: #6d5e00; white-space: nowrap;
        }
        .reminder-bar .reminder-status.active { background: #4caf84; color: #fff; }

        /* 积分卡片 */
        .score-card {
            background: var(--card); border-radius: var(--radius);
            padding: 20px 22px; margin: 8px 0 16px;
            box-shadow: var(--shadow-lg); display: flex; align-items: center;
            gap: 16px; position: relative; overflow: hidden; border: 2px solid #fff3e0;
        }
        .admin-mode .score-card { border-color: #e8e0f0; }
        .score-card::before {
            content: ''; position: absolute; top: -30px; right: -30px;
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,217,61,0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        .score-icon-wrap {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #fff3cd, #ffe69c);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 34px; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(255,183,77,0.3); position: relative; z-index: 1;
        }
        .score-info { flex: 1; position: relative; z-index: 1; }
        .score-info .label { font-size: 12px; color: var(--text-light); font-weight: 500; letter-spacing: 1px; }
        .score-info .points {
            font-size: 40px; font-weight: 900; color: var(--primary);
            line-height: 1; margin: 4px 0; font-variant-numeric: tabular-nums;
        }
        .score-info .points .unit { font-size: 16px; font-weight: 600; color: #cc9a6e; }
        .score-bar-wrap {
            background: #f0e6d8; border-radius: 10px; height: 10px; overflow: hidden; margin-top: 6px;
        }
        .score-bar-fill {
            height: 100%; background: linear-gradient(90deg, #ffb347, #ff7b42);
            border-radius: 10px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .score-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: #fff8e1; border-radius: 20px; padding: 4px 12px;
            font-size: 12px; font-weight: 600; color: #e6a800; white-space: nowrap;
        }

        /* 快捷操作 */
        .quick-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .quick-action-btn {
            font-size: 11px; padding: 5px 10px; border-radius: 14px;
            border: 1.5px solid #e0d5c5; background: #fff; cursor: pointer;
            transition: var(--transition); color: var(--text-light);
            white-space: nowrap; font-weight: 500;
        }
        .quick-action-btn:hover { border-color: var(--secondary); color: var(--primary); }
        .quick-action-btn:active { transform: scale(0.95); }

        /* 日期 */
        .date-banner {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
            font-size: 14px; font-weight: 600; color: var(--text-light);
        }
        .date-banner .dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--success);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* 选项卡 */
        .tabs {
            display: flex; gap: 6px; background: #f5ede0;
            border-radius: 16px; padding: 4px; margin-bottom: 14px;
        }
        .admin-mode .tabs { background: #e8e0f0; }
        .tab-btn {
            flex: 1; padding: 10px 6px; border: none; background: transparent;
            font-size: 13px; font-weight: 600; color: var(--text-light);
            border-radius: 13px; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 5px;
            white-space: nowrap; position: relative;
        }
        .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .admin-mode .tab-btn.active { color: var(--admin-primary); }
        .tab-btn:active { transform: scale(0.95); }
        .tab-badge {
            background: var(--pink); color: #fff; font-size: 10px;
            width: 18px; height: 18px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .tab-btn .new-dot {
            width: 6px; height: 6px; background: #ff4081; border-radius: 50%;
            position: absolute; top: 6px; right: 8px; animation: pulse-dot 1.5s infinite;
        }

        /* 面板 */
        .panel { display: none; animation: fadeSlideIn 0.35s ease; }
        .panel.active { display: block; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 任务卡片 */
        .section-title {
            font-size: 15px; font-weight: 700; margin-bottom: 10px;
            color: var(--text); display: flex; align-items: center;
            gap: 6px; justify-content: space-between;
        }
        .section-title .cat-label-text { display: flex; align-items: center; gap: 6px; }
        .section-title .cat-actions {
            font-size: 11px; font-weight: 500; color: #999; cursor: pointer;
            opacity: 0; transition: opacity 0.2s; padding: 2px 8px;
            border-radius: 10px; border: 1px solid transparent;
        }
        .section-title:hover .cat-actions { opacity: 1; }
        .section-title .cat-actions:hover {
            border-color: var(--admin-primary); color: var(--admin-primary); background: #f8f4ff;
        }
        .admin-mode .section-title .cat-actions { opacity: 1; }

        .task-card {
            background: var(--card); border-radius: var(--radius-sm);
            padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            transition: var(--transition); border: 2px solid transparent;
            position: relative; overflow: hidden;
        }
        .task-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
        .task-card:active { transform: scale(0.98); }
        .task-card.done { border-color: #d4edda; background: #f9fdf7; }
        .task-card.done::after {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px;
            background: var(--success); border-radius: 0 4px 4px 0;
        }
        .task-card .delete-btn {
            position: absolute; top: 6px; right: 8px; width: 22px; height: 22px;
            border-radius: 50%; background: #ffebee; border: none; color: #e57373;
            font-size: 12px; cursor: pointer; display: none; align-items: center;
            justify-content: center; z-index: 2; line-height: 1;
        }
        .admin-mode .task-card .delete-btn, .admin-mode .reward-card .delete-btn { display: flex; }
        .task-card .delete-btn:hover, .reward-card .delete-btn:hover { background: #ffcdd2; }

        .task-emoji { font-size: 36px; flex-shrink: 0; width: 48px; text-align: center; transition: var(--transition); }
        .task-card.done .task-emoji { animation: pop 0.4s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .task-info { flex: 1; min-width: 0; }
        .task-info .name { font-size: 15px; font-weight: 700; color: var(--text); }
        .task-info .desc { font-size: 11px; color: var(--text-light); margin-top: 1px; }
        .task-points {
            background: linear-gradient(135deg, #fff3cd, #ffe69c); color: #b8860b;
            font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 20px;
            white-space: nowrap; flex-shrink: 0; letter-spacing: 0.5px;
        }
        .task-check {
            width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #e0d5c5;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); font-size: 16px; color: transparent;
        }
        .task-card.done .task-check { background: var(--success); border-color: var(--success); color: #fff; }
        .task-card.done .task-points { background: #e8f5e9; color: #388e3c; }
        .task-card.done .task-info .name {
            color: #6c9a6f; text-decoration: line-through; text-decoration-thickness: 2px;
            text-decoration-color: #c8e6c9;
        }

        .category-tag {
            display: inline-block; font-size: 10px; padding: 2px 8px;
            border-radius: 10px; font-weight: 600; letter-spacing: 0.5px;
        }
        .tag-sport { background: #e3f2fd; color: #1565c0; }
        .tag-study { background: #f3e5f5; color: #7b1fa2; }
        .tag-chore { background: #fff3e0; color: #e65100; }
        .tag-art { background: #fce4ec; color: #c62828; }
        .tag-custom { background: #e8f5e9; color: #2e7d32; }

        /* 奖励卡片 */
        .reward-card {
            background: var(--card); border-radius: var(--radius-sm); padding: 16px;
            margin-bottom: 10px; box-shadow: var(--shadow); display: flex;
            align-items: center; gap: 12px; transition: var(--transition);
            border: 2px solid transparent; position: relative;
        }
        .reward-card.affordable { border-color: #ffe0b2; background: #fffdf7; }
        .reward-card.affordable:hover { border-color: var(--secondary); box-shadow: var(--shadow-lg); }
        .reward-card.locked { opacity: 0.55; filter: grayscale(0.4); }
        .reward-card .delete-btn {
            position: absolute; top: 6px; right: 8px; width: 22px; height: 22px;
            border-radius: 50%; background: #ffebee; border: none; color: #e57373;
            font-size: 12px; cursor: pointer; display: none; align-items: center;
            justify-content: center; z-index: 2; line-height: 1;
        }
        .reward-emoji { font-size: 40px; flex-shrink: 0; width: 52px; text-align: center; }
        .reward-info { flex: 1; min-width: 0; }
        .reward-info .name { font-size: 15px; font-weight: 700; }
        .reward-info .desc { font-size: 11px; color: var(--text-light); }
        .reward-cost {
            font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 20px;
            white-space: nowrap; background: #fff3e0; color: #e65100;
        }
        .reward-card.affordable .reward-cost {
            background: #fff3cd; color: #b8860b; animation: glow-pulse 1.8s ease-in-out infinite;
        }
        @keyframes glow-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,183,77,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,183,77,0); }
        }
        .btn-redeem {
            padding: 8px 16px; border: none; border-radius: 20px; font-weight: 700;
            font-size: 12px; cursor: pointer; transition: var(--transition);
            white-space: nowrap; flex-shrink: 0; letter-spacing: 0.5px;
        }
        .btn-redeem.available {
            background: linear-gradient(135deg, #ffb347, #ff7b42); color: #fff;
            box-shadow: 0 3px 12px rgba(255,123,66,0.3);
        }
        .btn-redeem.available:active { transform: scale(0.93); }
        .btn-redeem.locked-btn { background: #e0d5c5; color: #999; cursor: not-allowed; }

        /* 成就面板 */
        .achievement-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .achievement-card {
            background: var(--card); border-radius: var(--radius-sm); padding: 16px 12px;
            text-align: center; box-shadow: var(--shadow); transition: var(--transition);
            border: 2px solid transparent;
        }
        .achievement-card.earned { border-color: #ffe082; background: #fffdf5; }
        .achievement-card .ach-emoji { font-size: 40px; display: block; margin-bottom: 6px; }
        .achievement-card .ach-name { font-size: 13px; font-weight: 700; }
        .achievement-card .ach-desc { font-size: 10px; color: var(--text-light); margin-top: 2px; }
        .ach-badge {
            display: inline-block; margin-top: 6px; font-size: 10px;
            font-weight: 600; padding: 3px 10px; border-radius: 12px;
        }
        .badge-earned { background: #fff9c4; color: #f9a825; }
        .badge-locked { background: #f5f5f5; color: #bbb; }

        /* 管理面板 */
        .admin-panel {
            background: #fff; border-radius: var(--radius); padding: 20px;
            margin-bottom: 14px; box-shadow: var(--shadow-lg); border: 2px solid #e8e0f0;
        }
        .admin-panel h3 {
            font-size: 16px; margin-bottom: 14px; color: var(--admin-primary);
            display: flex; align-items: center; gap: 6px;
        }
        .admin-section {
            margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #f0edf5;
        }
        .admin-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .admin-section h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #555; }
        .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: flex-end; }
        .form-row input, .form-row select {
            padding: 10px 12px; border: 2px solid #e8e0f0; border-radius: 10px;
            font-size: 13px; font-family: inherit; transition: var(--transition);
            background: #faf8ff; color: #333;
        }
        .form-row input:focus, .form-row select:focus {
            outline: none; border-color: #b388ff; background: #fff;
        }
        .form-row input { flex: 1; min-width: 80px; }
        .form-row select { min-width: 90px; }
        .btn-sm {
            padding: 8px 16px; border: none; border-radius: 10px; font-size: 12px;
            font-weight: 700; cursor: pointer; transition: var(--transition);
            white-space: nowrap; letter-spacing: 0.5px;
        }
        .btn-sm:active { transform: scale(0.95); }
        .btn-primary { background: var(--admin-primary); color: #fff; }
        .btn-primary:hover { background: #651fff; }
        .btn-danger { background: #ff5252; color: #fff; }
        .btn-outline { background: #fff; border: 2px solid var(--admin-primary); color: var(--admin-primary); }
        .btn-outline:hover { background: #f8f4ff; }
        .btn-success-sm { background: #4caf84; color: #fff; }

        .reminder-settings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .reminder-settings input[type="time"] {
            padding: 8px 10px; border: 2px solid #e8e0f0; border-radius: 10px;
            font-size: 13px; background: #faf8ff;
        }
        .reminder-settings input[type="time"]:focus { outline: none; border-color: #b388ff; }
        .toggle-switch { position: relative; width: 48px; height: 26px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; inset: 0; background: #ddd;
            border-radius: 26px; transition: 0.3s;
        }
        .toggle-slider::before {
            content: ''; position: absolute; width: 20px; height: 20px; left: 3px; bottom: 3px;
            background: #fff; border-radius: 50%; transition: 0.3s;
        }
        input:checked + .toggle-slider { background: var(--admin-primary); }
        input:checked + .toggle-slider::before { transform: translateX(22px); }

        .weekly-report { background: #faf8ff; border-radius: 12px; padding: 14px; margin-top: 8px; }
        .weekly-report .stat-row {
            display: flex; justify-content: space-between; padding: 4px 0;
            font-size: 13px; border-bottom: 1px dotted #e8e0f0;
        }
        .weekly-report .stat-row:last-child { border-bottom: none; }
        .weekly-report .stat-val { font-weight: 700; color: var(--admin-primary); }

        /* 弹窗 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100;
            display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: #fff; border-radius: var(--radius); padding: 28px 22px 22px;
            margin: 20px; max-width: 400px; width: 100%; text-align: center;
            box-shadow: 0 20px 48px rgba(0,0,0,0.18); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal .modal-emoji { font-size: 60px; animation: pop 0.5s ease; }
        .modal h3 { font-size: 20px; margin: 10px 0 4px; }
        .modal p { font-size: 14px; color: var(--text-light); margin-bottom: 18px; line-height: 1.5; }
        .modal .btn-confirm {
            background: linear-gradient(135deg, #ffb347, #ff7b42); color: #fff; border: none;
            padding: 12px 40px; font-size: 15px; font-weight: 700; border-radius: 25px;
            cursor: pointer; letter-spacing: 1px; transition: var(--transition);
        }
        .modal .btn-confirm:active { transform: scale(0.94); }
        .modal .btn-cancel {
            background: transparent; border: 2px solid #ddd; color: #999;
            padding: 10px 30px; font-size: 14px; border-radius: 25px; cursor: pointer;
            margin-right: 10px; transition: var(--transition);
        }
        .modal .btn-cancel:active { background: #f5f5f5; }
        .password-input {
            padding: 12px 16px; border: 2px solid #e8e0f0; border-radius: 12px;
            font-size: 16px; text-align: center; width: 150px; letter-spacing: 4px; font-family: inherit;
        }
        .password-input:focus { outline: none; border-color: #b388ff; }

        /* 撒花 */
        .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
        .confetti-piece {
            position: absolute; width: 12px; height: 12px; border-radius: 3px;
            animation: confetti-fall 1.2s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0); opacity: 0; }
        }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 10px 22px; border-radius: 25px;
            font-size: 14px; font-weight: 600; z-index: 300;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
            white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* 底部 */
        .footer-actions { text-align: center; margin-top: 20px; padding-bottom: 10px; }
        .btn-reset {
            background: transparent; border: 1.5px solid #e0d5c5; color: #bbb;
            padding: 8px 20px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: var(--transition);
        }
        .btn-reset:hover { border-color: #ffaaaa; color: #e57373; }

        .exit-admin-btn {
            position: fixed; bottom: 20px; right: 20px; background: var(--admin-primary);
            color: #fff; border: none; padding: 10px 20px; border-radius: 25px;
            font-weight: 700; font-size: 13px; cursor: pointer; z-index: 50;
            box-shadow: 0 4px 16px rgba(124,77,255,0.3); transition: var(--transition);
        }
        .exit-admin-btn:active { transform: scale(0.95); }

        @media (max-width: 400px) {
            .app-container { padding: 8px 10px 130px; }
            .task-card { padding: 12px; gap: 8px; }
            .task-emoji { font-size: 28px; width: 36px; }
            .task-info .name { font-size: 13px; }
            .task-points { font-size: 11px; padding: 4px 10px; }
            .score-info .points { font-size: 32px; }
            .header h1 { font-size: 22px; }
            .form-row input, .form-row select { padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">

            </div>

        </div>

        <div class="score-card">
            <div class="score-icon-wrap">⭐</div>
            <div class="score-info">
                <div class="label">我的积分</div>
                <div class="points" id="totalPoints">0<span class="unit"> 分</span></div>
                <div class="score-bar-wrap"><div class="score-bar-fill" id="scoreBar" style="width:0%;"></div></div>

        <div class="date-banner">

        <div class="tabs" id="mainTabs">
            <button class="tab-btn active" data-tab="tasks">✅ 任务打卡 <span class="tab-badge" id="taskTabBadge" style="display:none;">0</span></button>
            <button class="tab-btn" data-tab="rewards">🎁 奖励兑换</button>
            <button class="tab-btn" data-tab="achievements">🏆 成就徽章</button>
            <button class="tab-btn" data-tab="admin" id="adminTabBtn" style="display:none;">⚙️ 管理 <span class="new-dot"></span></button>
        </div>

        <div class="panel active" id="panel-tasks">
            <div class="section-title"><span class="cat-label-text">🏃 运动锻炼</span><span class="cat-actions" data-add-task="sport">+添加</span></div>
            <div id="sportTasks"></div>
            <div class="section-title" style="margin-top:14px;"><span class="cat-label-text">📚 学习成长</span><span class="cat-actions" data-add-task="study">+添加</span></div>
            <div id="studyTasks"></div>
            <div class="section-title" style="margin-top:14px;"><span class="cat-label-text">🧹 家务劳动</span><span class="cat-actions" data-add-task="chore">+添加</span></div>
            <div id="choreTasks"></div>
            <div class="section-title" style="margin-top:14px;"><span class="cat-label-text">🎨 兴趣才艺</span><span class="cat-actions" data-add-task="art">+添加</span></div>
            <div id="artTasks"></div>
            <div id="customTasksSection" style="display:none;">
                <div class="section-title" style="margin-top:14px;"><span class="cat-label-text">🌟 自定义任务</span></div>
                <div id="customTasks"></div>
            </div>
        </div>

        <div class="panel" id="panel-rewards">
            <div class="section-title"><span class="cat-label-text">🎁 心愿兑换商店</span><span class="cat-actions" data-add-reward="">+添加</span></div>
            <div id="rewardList"></div>
            <p style="text-align:center;color:#bbb;font-size:12px;margin-top:10px;">💡 攒够积分就可以兑换心愿啦！</p>

        <div class="panel" id="panel-achievements">
            <div class="section-title">🏆 成长徽章</div>
            <div class="achievement-grid" id="achievementGrid"></div>

        <div class="panel" id="panel-admin">
            <div class="admin-panel">
                <h3>⚙️ 家长管理面板</h3>

                    <h4>🔔 每日任务提醒</h4>
                    <div class="reminder-settings">
                        <label style="font-size:13px;display:flex;align-items:center;gap:6px;">

                        <input type="time" id="reminderTimeInput" value="17:00" style="margin-left:8px;">

                    <div class="form-row">

                <div class="admin-section">
                    <h4>🎁 添加新奖励</h4>
                    <div class="form-row">
                        <input type="text" id="newRewardName" placeholder="奖励名称" maxlength="20">
                        <input type="text" id="newRewardDesc" placeholder="描述" maxlength="30" style="max-width:130px;">
                        <input type="number" id="newRewardCost" placeholder="所需积分" min="5" max="500" value="30" style="max-width:80px;">
                        <input type="text" id="newRewardEmoji" placeholder="图标" maxlength="4" style="max-width:60px;" value="🎁">
                    </div>
                    <button class="btn-sm btn-primary" id="btnAddReward">添加奖励</button>
                </div>
                <div class="admin-section">
                    <h4>📝 手动调整积分</h4>
                    <div class="form-row">
                        <input type="number" id="adjustPoints" placeholder="积分数量" style="max-width:100px;">
                        <button class="btn-sm btn-success-sm" id="btnAddPoints">➕ 加积分</button>
                        <button class="btn-sm btn-danger" id="btnSubPoints">➖ 减积分</button>
                    </div>
                </div>
                <div class="admin-section">
                    <h4>📊 本周统计</h4>
                    <div class="weekly-report" id="weeklyReport"><p style="color:#999;font-size:12px;">加载中...</p></div>
                </div>
                <div class="admin-section">
                    <h4>🗂️ 数据管理</h4>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn-sm btn-outline" id="btnExportData">📥 导出数据</button>
                        <button class="btn-sm btn-outline" id="btnImportData">📤 导入数据</button>
                        <button class="btn-sm btn-danger" id="btnResetAll">🗑️ 清空全部</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn-reset" id="btnResetDay">🔄 重置今日打卡</button>
        </div>
    </div>

    <button class="exit-admin-btn" id="exitAdminBtn" style="display:none;">🔒 退出管理</button>
    <div id="modalContainer"></div>
    <div id="toastContainer"></div>
    <div id="confettiContainer" class="confetti-container"></div>

    <script>
        (function() {
            'use strict';

            // ==================== 默认数据 ====================
            var DEFAULT_TASKS = [
                { id:'jump_rope', name:'跳绳', desc:'跳100个绳', points:5, emoji:'🪢', category:'sport' },
                { id:'running', name:'跑步', desc:'跑步10分钟', points:5, emoji:'🏃', category:'sport' },
                { id:'stretch', name:'拉伸运动', desc:'做拉伸操5分钟', points:3, emoji:'🤸', category:'sport' },
                { id:'homework', name:'写作业', desc:'认真完成作业', points:8, emoji:'✏️', category:'study' },
                { id:'reading', name:'阅读', desc:'阅读课外书15分钟', points:6, emoji:'📖', category:'study' },
                { id:'math', name:'数学练习', desc:'做一页数学题', points:5, emoji:'🔢', category:'study' },
                { id:'sweep', name:'扫地', desc:'把地扫干净', points:4, emoji:'🧹', category:'chore' },
                { id:'dishes', name:'洗碗', desc:'帮忙洗碗筷', points:5, emoji:'🍽️', category:'chore' },
                { id:'tidy', name:'整理房间', desc:'收拾玩具和书桌', points:4, emoji:'🧸', category:'chore' },
                { id:'dance', name:'跳舞', desc:'练习舞蹈10分钟', points:5, emoji:'💃', category:'art' },
                { id:'drawing', name:'画画', desc:'画一幅画', points:4, emoji:'🎨', category:'art' },
                { id:'music', name:'音乐', desc:'唱歌或弹琴10分钟', points:4, emoji:'🎵', category:'art' },
            ];

            var DEFAULT_REWARDS = [
                { id:'movie', name:'亲子电影', desc:'和爸爸妈妈一起看场电影 🍿', cost:40, emoji:'🎬' },
                { id:'cycling', name:'周末骑行', desc:'爸爸或妈妈陪我骑行', cost:50, emoji:'🚴' },
                { id:'park', name:'游乐园', desc:'去游乐园玩一天', cost:100, emoji:'🎢' },
                { id:'shopping', name:'购物时光', desc:'买一件喜欢的衣服或玩具', cost:60, emoji:'🛍️' },
                { id:'wish', name:'小愿望', desc:'实现自己的一个小愿望', cost:80, emoji:'💝' },
                { id:'picnic', name:'户外野餐', desc:'全家一起去公园野餐', cost:45, emoji:'🧺' },
                { id:'icecream', name:'冰淇淋日', desc:'可以吃一个冰淇淋', cost:15, emoji:'🍦' },
                { id:'game_time', name:'游戏时间', desc:'多玩30分钟游戏', cost:20, emoji:'🎮' },
            ];

            var DEFAULT_ACHIEVEMENTS = [
                { id:'first_10', name:'初露锋芒', desc:'累计获得10积分', emoji:'🌟', threshold:10 },
                { id:'first_50', name:'积分小达人', desc:'累计获得50积分', emoji:'⭐', threshold:50 },
                { id:'first_100', name:'积分高手', desc:'累计获得100积分', emoji:'💫', threshold:100 },
                { id:'first_200', name:'积分王者', desc:'累计获得200积分', emoji:'👑', threshold:200 },
                { id:'streak_3', name:'三天坚持', desc:'连续3天打卡', emoji:'🔥', threshold:3, type:'streak' },
                { id:'streak_7', name:'一周之星', desc:'连续7天打卡', emoji:'🌈', threshold:7, type:'streak' },
                { id:'all_done', name:'全能小冠军', desc:'单日完成全部任务', emoji:'🏅', threshold:999, type:'daily_all' },
                { id:'first_redeem', name:'首次兑换', desc:'兑换第一个奖励', emoji:'🎉', threshold:1, type:'redeem' },
            ];

            var CAT_INFO = {
                sport: { tag:'tag-sport', label:'运动锻炼' },
                study: { tag:'tag-study', label:'学习成长' },
                chore: { tag:'tag-chore', label:'家务劳动' },
                art:   { tag:'tag-art',   label:'兴趣才艺' },
                custom:{ tag:'tag-custom',label:'自定义任务' },
            };

            var ADMIN_PASSWORD = '2024';
            var STORAGE_KEY = 'growth_journal_data_v2';

            // ==================== 状态 ====================
            var state, isAdminMode = false, reminderCheckInterval = null;

            function getDefaultState() {
                return {
                    totalPoints:0, lifetimePoints:0, todayDone:{}, todayDate:getDateStr(),
                    streak:0, lastActiveDate:null, redeemedRewards:[], earnedAchievements:[],
                    customTasks:[], customRewards:[], deletedDefaultTasks:[], deletedDefaultRewards:[],
                    reminderEnabled:false, reminderTime:'17:00', weeklyHistory:{},
                };
            }

            function loadState() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        var parsed = JSON.parse(raw);
                        var def = getDefaultState();
                        for (var k in def) { if (!(k in parsed)) parsed[k] = def[k]; }
                        return parsed;
                    }
                } catch(e) {}
                return getDefaultState();
            }

            function saveState() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
            }

            function getDateStr() {
                var d = new Date();
                return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            }

            function getAllTasks() {
                var defaults = DEFAULT_TASKS.filter(function(t){ return state.deletedDefaultTasks.indexOf(t.id)<0; });
                var customs = (state.customTasks||[]).map(function(t){
                    var info = CAT_INFO[t.category] || CAT_INFO.custom;
                    t.categoryTag = info.tag; t.catLabel = info.label; return t;
                });
                return defaults.concat(customs);
            }

            function getAllRewards() {
                var defaults = DEFAULT_REWARDS.filter(function(r){ return state.deletedDefaultRewards.indexOf(r.id)<0; });
                return defaults.concat(state.customRewards || []);
            }

            function checkNewDay() {
                var today = getDateStr();
                if (state.todayDate !== today) {
                    if (state.lastActiveDate) {
                        var last = new Date(state.lastActiveDate);
                        var now = new Date(today);
                        var diff = Math.floor((now-last)/(1000*60*60*24));
                        if (diff===1) state.streak = Math.min(state.streak+1, 365);
                        else if (diff>1) state.streak = 0;
                    }
                    var yKey = state.todayDate;
                    if (yKey && Object.keys(state.todayDone).length>0) {
                        if (!state.weeklyHistory) state.weeklyHistory = {};
                        state.weeklyHistory[yKey] = Object.assign({}, state.todayDone);
                        var keys = Object.keys(state.weeklyHistory);
                        if (keys.length>30) {
                            keys.sort();
                            for (var i=0; i<keys.length-30; i++) delete state.weeklyHistory[keys[i]];
                        }
                    }
                    state.todayDate = today; state.todayDone = {}; state.lastActiveDate = today;
                    saveState();
                }
            }

            // ==================== 渲染 ====================
            function renderAll() {
                checkNewDay();
                updateScore(); renderTasks(); renderRewards(); renderAchievements();
                updateDate(); updateTabBadges(); updateReminderBar(); updateWeeklyReport(); updateAdminUI();
            }

            function updateScore() {
                document.getElementById('totalPoints').innerHTML = state.totalPoints+'<span class="unit"> 分</span>';
                document.getElementById('scoreBar').style.width = Math.min(state.totalPoints/200*100,100)+'%';
                document.getElementById('streakBadge').textContent = '🔥 连续 '+state.streak+' 天';
            }

            function updateDate() {
                var t = new Date();
                var w = ['日','一','二','三','四','五','六'];
                document.getElementById('dateDisplay').textContent = t.getFullYear()+'年'+(t.getMonth()+1)+'月'+t.getDate()+'日 星期'+w[t.getDay()];
                var all = getAllTasks();
                var done = Object.keys(state.todayDone).filter(function(id){ return all.some(function(t){return t.id===id;}); }).length;
                document.getElementById('doneCount').textContent = done;
                document.getElementById('totalCount').textContent = all.length;
            }

            function renderTasks() {
                var cats = { sport:'#sportTasks', study:'#studyTasks', chore:'#choreTasks', art:'#artTasks', custom:'#customTasks' };
                for (var k in cats) { var el = document.querySelector(cats[k]); if (el) el.innerHTML = ''; }
                var all = getAllTasks();
                var hasCustom = false;
                all.forEach(function(task) {
                    if (task.category==='custom') hasCustom = true;
                    var container = document.querySelector(cats[task.category]);
                    if (!container) return;
                    var info = CAT_INFO[task.category] || CAT_INFO.custom;
                    var isDone = state.todayDone[task.id];
                    var card = document.createElement('div');
                    card.className = 'task-card'+(isDone?' done':'');
                    card.dataset.taskId = task.id;
                    card.innerHTML =
                        '<span class="task-emoji">'+(task.emoji||'⭐')+'</span>'+
                        '<div class="task-info"><div class="name">'+task.name+'</div>'+
                        '<div class="desc"><span class="category-tag '+(task.categoryTag||info.tag)+'">'+(task.catLabel||info.label)+'</span> '+(task.desc||'')+'</div></div>'+
                        '<span class="task-points">+'+task.points+'⭐</span>'+
                        '<span class="task-check">✓</span>'+
                        '<button class="delete-btn" title="删除">×</button>';
                    container.appendChild(card);
                });
                var cs = document.getElementById('customTasksSection');
                if (cs) cs.style.display = hasCustom ? 'block' : 'none';
            }

            function renderRewards() {
                var container = document.getElementById('rewardList');
                container.innerHTML = '';
                getAllRewards().forEach(function(reward) {
                    var afford = state.totalPoints >= reward.cost;
                    var redeemed = state.redeemedRewards.indexOf(reward.id) >= 0;
                    var card = document.createElement('div');
                    card.className = 'reward-card' + (redeemed ? '' : afford ? ' affordable' : ' locked');
                    if (redeemed) card.style.opacity = '0.6';
                    card.dataset.rewardId = reward.id;
                    card.innerHTML =
                        '<span class="reward-emoji">'+(reward.emoji||'🎁')+'</span>'+
                        '<div class="reward-info"><div class="name">'+reward.name+'</div><div class="desc">'+(reward.desc||'')+'</div></div>'+
                        '<span class="reward-cost">'+reward.cost+'⭐</span>'+
                        '<button class="btn-redeem '+(afford&&!redeemed?'available':'locked-btn')+'">'+(redeemed?'已兑换 ✓':'兑换')+'</button>'+
                        '<button class="delete-btn" title="删除">×</button>';
                    container.appendChild(card);
                });
            }

            function renderAchievements() {
                var container = document.getElementById('achievementGrid');
                container.innerHTML = '';
                var allTasks = getAllTasks();
                DEFAULT_ACHIEVEMENTS.forEach(function(ach) {
                    var earned = state.earnedAchievements.indexOf(ach.id) >= 0;
                    if (!earned) {
                        if (ach.type==='streak') earned = state.streak >= ach.threshold;
                        else if (ach.type==='daily_all') earned = Object.keys(state.todayDone).filter(function(id){return allTasks.some(function(t){return t.id===id;});}).length >= allTasks.length && allTasks.length>0;
                        else if (ach.type==='redeem') earned = state.redeemedRewards.length >= ach.threshold;
                        else earned = state.lifetimePoints >= ach.threshold;
                        if (earned && state.earnedAchievements.indexOf(ach.id)<0) {
                            state.earnedAchievements.push(ach.id); saveState();
                            showConfetti(); showToast('🏆 获得徽章：'+ach.name+'！');
                        }
                    }
                    var card = document.createElement('div');
                    card.className = 'achievement-card'+(earned?' earned':'');
                    card.innerHTML =
                        '<span class="ach-emoji">'+(earned?ach.emoji:'🔒')+'</span>'+
                        '<div class="ach-name">'+ach.name+'</div>'+
                        '<div class="ach-desc">'+ach.desc+'</div>'+
                        '<span class="ach-badge '+(earned?'badge-earned':'badge-locked')+'">'+(earned?'已获得 ✨':'未解锁')+'</span>';
                    container.appendChild(card);
                });
            }

            function updateTabBadges() {
                var all = getAllTasks();
                var pending = all.length - Object.keys(state.todayDone).filter(function(id){return all.some(function(t){return t.id===id;});}).length;
                var badge = document.getElementById('taskTabBadge');
                if (pending>0) { badge.style.display='inline-flex'; badge.textContent=pending; }
                else { badge.style.display='none'; }
            }

            function updateReminderBar() {
                var bar = document.getElementById('reminderBar');
                var all = getAllTasks();
                var done = Object.keys(state.todayDone).filter(function(id){return all.some(function(t){return t.id===id;});}).length;
                if (state.reminderEnabled && done<all.length) {
                    bar.style.display='flex';
                    document.getElementById('reminderText').textContent = '还有 '+(all.length-done)+' 个任务未完成，继续加油哦！💪';
                    document.getElementById('reminderTime').textContent = '⏰ 提醒时间：每天 '+state.reminderTime;
                    document.getElementById('reminderStatus').textContent = done+'/'+all.length;
                    document.getElementById('reminderStatus').className = 'reminder-status';
                } else if (state.reminderEnabled && done>=all.length && all.length>0) {
                    bar.style.display='flex';
                    document.getElementById('reminderText').textContent = '🎉 太棒了！今天所有任务都完成了！';
                    document.getElementById('reminderTime').textContent = '你是最棒的！';
                    document.getElementById('reminderStatus').textContent = '已完成';
                    document.getElementById('reminderStatus').className = 'reminder-status active';
                } else { bar.style.display='none'; }
            }

            function updateWeeklyReport() {
                var c = document.getElementById('weeklyReport');
                if (!c) return;
                var now = new Date();
                var dow = now.getDay();
                var monday = new Date(now);
                monday.setDate(now.getDate()-(dow===0?6:dow-1));
                var all = getAllTasks();
                var pm = {}; all.forEach(function(t){ pm[t.id]=t.points; });
                var wDone=0, wPts=0;
                for (var i=0; i<7; i++) {
                    var d = new Date(monday); d.setDate(monday.getDate()+i);
                    var ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
                    if (ds===state.todayDate) {
                        Object.keys(state.todayDone).forEach(function(id){ if(pm[id]){ wDone++; wPts+=pm[id]; } });
                    } else if (state.weeklyHistory && state.weeklyHistory[ds]) {
                        Object.keys(state.weeklyHistory[ds]).forEach(function(id){ if(pm[id]){ wDone++; wPts+=pm[id]; } });
                    }
                }
                c.innerHTML =
                    '<div class="stat-row"><span>📅 本周完成次数</span><span class="stat-val">'+wDone+' 次</span></div>'+
                    '<div class="stat-row"><span>⭐ 本周获得积分</span><span class="stat-val">'+wPts+' 分</span></div>'+
                    '<div class="stat-row"><span>🔥 连续打卡</span><span class="stat-val">'+state.streak+' 天</span></div>'+
                    '<div class="stat-row"><span>🏆 累计积分</span><span class="stat-val">'+state.lifetimePoints+' 分</span></div>'+
                    '<div class="stat-row"><span>🎁 已兑换奖励</span><span class="stat-val">'+state.redeemedRewards.length+' 次</span></div>';
            }

            // ==================== 交互逻辑 ====================
            function toggleTask(task) {
                var was = state.todayDone[task.id];
                var card = document.querySelector('.task-card[data-task-id="'+task.id+'"]');
                if (was) {
                    delete state.todayDone[task.id];
                    state.totalPoints = Math.max(0, state.totalPoints-task.points);
                    state.lifetimePoints = Math.max(0, state.lifetimePoints-task.points);
                    if (card) card.classList.remove('done');
                    showToast('已取消：'+task.name);
                } else {
                    state.todayDone[task.id] = true;
                    state.totalPoints += task.points;
                    state.lifetimePoints += task.points;
                    if (card) {
                        card.classList.add('done');
                        var emoji = card.querySelector('.task-emoji');
                        if (emoji) { emoji.style.animation='none'; void emoji.offsetWidth; emoji.style.animation='pop 0.4s ease'; }
                    }
                    showToast('✅ '+task.name+' 完成！+'+task.points+'⭐');
                    var all = getAllTasks();
                    var done = Object.keys(state.todayDone).filter(function(id){return all.some(function(t){return t.id===id;});}).length;
                    if (done%5===0) showConfetti();
                    if (done===all.length && all.length>0) {
                        setTimeout(function(){ showModal('🎊','太棒了！','你今天完成了全部任务！你是全能小冠军！🏅',true); }, 500);
                    }
                }
                state.lastActiveDate = getDateStr();
                if (state.streak===0 && Object.keys(state.todayDone).length>0) state.streak = 1;
                saveState(); renderAll();
            }

            function quickComplete(taskId) {
                var all = getAllTasks();
                var task = all.find(function(t){return t.id===taskId;});
                if (!task) return;
                if (state.todayDone[taskId]) { showToast(task.name+' 已经完成过了~'); return; }
                state.todayDone[taskId]=true;
                state.totalPoints+=task.points; state.lifetimePoints+=task.points;
                state.lastActiveDate=getDateStr();
                if (state.streak===0) state.streak=1;
                saveState(); renderAll();
                showToast('✅ '+task.name+' 完成！+'+task.points+'⭐');
            }

            function redeemReward(reward) {
                if (state.totalPoints<reward.cost || state.redeemedRewards.indexOf(reward.id)>=0) return;
                showModal(reward.emoji||'🎁', '兑换：'+reward.name,
                    '需要消耗 <strong>'+reward.cost+'⭐</strong> 积分，确认兑换吗？<br>当前积分：'+state.totalPoints+'⭐',
                    false, function() {
                        state.totalPoints -= reward.cost;
                        state.redeemedRewards.push(reward.id);
                        saveState(); showConfetti();
                        showToast('🎉 成功兑换：'+reward.name+'！'); renderAll();
                    });
            }

            function deleteTask(task) {
                if (!isAdminMode) return;
                showModal('🗑️','删除任务','确定要删除「'+task.name+'」吗？<br><small>这不会影响已获得的积分</small>',false,function(){
                    if (DEFAULT_TASKS.some(function(t){return t.id===task.id;})) {
                        state.deletedDefaultTasks.push(task.id);
                    } else {
                        state.customTasks = state.customTasks.filter(function(t){return t.id!==task.id;});
                    }
                    saveState(); renderAll(); showToast('已删除：'+task.name);
                });
            }

            function deleteReward(reward) {
                if (!isAdminMode) return;
                showModal('🗑️','删除奖励','确定要删除「'+reward.name+'」吗？',false,function(){
                    if (DEFAULT_REWARDS.some(function(r){return r.id===reward.id;})) {
                        state.deletedDefaultRewards.push(reward.id);
                    } else {
                        state.customRewards = state.customRewards.filter(function(r){return r.id!==reward.id;});
                    }
                    saveState(); renderAll(); showToast('已删除：'+reward.name);
                });
            }

            function addCustomTask() {
                var name=document.getElementById('newTaskName').value.trim();
                var desc=document.getElementById('newTaskDesc').value.trim();
                var pts=parseInt(document.getElementById('newTaskPoints').value)||5;
                var cat=document.getElementById('newTaskCategory').value;
                var emoji=document.getElementById('newTaskEmoji').value.trim()||'⭐';
                if (!name) { showToast('请输入任务名称'); return; }
                if (pts<1||pts>50) { showToast('积分范围：1-50'); return; }
                state.customTasks.push({ id:'custom_'+Date.now(), name:name, desc:desc, points:pts, emoji:emoji, category:cat });
                saveState(); renderAll(); showToast('✅ 已添加任务：'+name);
                document.getElementById('newTaskName').value='';
                document.getElementById('newTaskDesc').value='';
                document.getElementById('newTaskPoints').value='5';
                document.getElementById('newTaskEmoji').value='⭐';
            }

            function addCustomReward() {
                var name=document.getElementById('newRewardName').value.trim();
                var desc=document.getElementById('newRewardDesc').value.trim();
                var cost=parseInt(document.getElementById('newRewardCost').value)||30;
                var emoji=document.getElementById('newRewardEmoji').value.trim()||'🎁';
                if (!name) { showToast('请输入奖励名称'); return; }
                if (cost<5||cost>500) { showToast('积分范围：5-500'); return; }
                state.customRewards.push({ id:'reward_'+Date.now(), name:name, desc:desc, cost:cost, emoji:emoji });
                saveState(); renderAll(); showToast('✅ 已添加奖励：'+name);
                document.getElementById('newRewardName').value='';
                document.getElementById('newRewardDesc').value='';
                document.getElementById('newRewardCost').value='30';
                document.getElementById('newRewardEmoji').value='🎁';
            }

            function adjustPoints(sign) {
                var amt=parseInt(document.getElementById('adjustPoints').value)||0;
                if (amt<=0) { showToast('请输入有效积分数量'); return; }
                var delta=sign*amt;
                state.totalPoints=Math.max(0, state.totalPoints+delta);
                if (delta>0) state.lifetimePoints+=delta;
                else state.lifetimePoints=Math.max(0, state.lifetimePoints+delta);
                saveState(); renderAll();
                showToast((delta>=0?'➕':'➖')+' 积分'+(delta>=0?'增加':'减少')+'了 '+Math.abs(delta)+' 分');
                document.getElementById('adjustPoints').value='';
            }

                document.getElementById('newTaskCategory').value=category;

            function resetDay() {
                showModal('🔄','重置今日打卡','这会清除今天所有打卡记录并扣除相应积分，确定吗？',false,function(){
                    var pts=0; var all=getAllTasks(); var pm={}; all.forEach(function(t){pm[t.id]=t.points;});
                    Object.keys(state.todayDone).forEach(function(id){ if(pm[id]) pts+=pm[id]; });
                    state.todayDone={};
                    state.totalPoints=Math.max(0, state.totalPoints-pts);
                    state.lifetimePoints=Math.max(0, state.lifetimePoints-pts);
                    saveState(); renderAll(); showToast('今日打卡已重置');
                });

            function resetAll() {
                showModal('🗑️','清空全部数据','这将清除所有数据，<strong>不可恢复</strong>！确定吗？',false,function(){
                    state=getDefaultState(); saveState(); renderAll(); showToast('所有数据已清空');
                });
            }

            // ==================== 提醒 ====================
            function toggleReminder() {
                state.reminderEnabled=document.getElementById('reminderToggle').checked;
                saveState();
                if (state.reminderEnabled) { startReminderCheck(); showToast('🔔 每日提醒已开启'); requestNotificationPermission(); }
                else { stopReminderCheck(); showToast('🔔 每日提醒已关闭'); }
                renderAll();
            }

            function updateReminderTime() {
                state.reminderTime=document.getElementById('reminderTimeInput').value;
                saveState();
                if (state.reminderEnabled) { stopReminderCheck(); startReminderCheck(); }
                showToast('⏰ 提醒时间已设为 '+state.reminderTime);
                renderAll();
            }

            function startReminderCheck() {
                stopReminderCheck();
                if (!state.reminderEnabled) return;
                reminderCheckInterval=setInterval(checkReminder,30000);
                checkReminder();
            }

            function stopReminderCheck() {
                if (reminderCheckInterval) { clearInterval(reminderCheckInterval); reminderCheckInterval=null; }
            }

            function checkReminder() {
                if (!state.reminderEnabled) return;
                var now=new Date();
                var parts=(state.reminderTime||'17:00').split(':');
                var target=new Date(now);
                target.setHours(parseInt(parts[0]),parseInt(parts[1]),0,0);
                var diffMin=(now-target)/(1000*60);
                if (diffMin>=0 && diffMin<10) {
                    var all=getAllTasks();
                    var done=Object.keys(state.todayDone).filter(function(id){return all.some(function(t){return t.id===id;});}).length;
                    if (done<all.length) sendReminderNotification(all.length-done);
                }
            }

            function sendReminderNotification(pending) {
                if ('Notification' in window && Notification.permission==='granted') {
                    try { new Notification('🌟 小小成长记 - 任务提醒', { body:'还有 '+pending+' 个任务未完成哦！快来打卡赚积分吧~', tag:'daily-reminder' }); } catch(e) {}
                }
                showToast('🔔 还有 '+pending+' 个任务等你完成！');
            }

            function requestNotificationPermission() {
                if ('Notification' in window) {
                    Notification.requestPermission().then(function(perm){
                        if (perm==='granted') showToast('📢 通知权限已开启！');
                        else showToast('⚠️ 通知权限被拒绝，请在浏览器设置中开启');
                    });
                } else { showToast('⚠️ 你的浏览器不支持通知功能'); }
            }

            function testReminder() {
                var all=getAllTasks();
                var done=Object.keys(state.todayDone).filter(function(id){return all.some(function(t){return t.id===id;});}).length;
                var pending=all.length-done;
                if (pending>0) { sendReminderNotification(pending); showToast('🔔 测试提醒已发送！'); }
                else { showToast('🎉 所有任务已完成，无需提醒！'); }
            }

            // ==================== 导入导出 ====================
            function exportData() {
                var data=JSON.stringify(state,null,2);
                var blob=new Blob([data],{type:'application/json'});
                var url=URL.createObjectURL(blob);
                var a=document.createElement('a');
                a.href=url; a.download='小小成长记_备份_'+getDateStr()+'.json';
                a.click(); URL.revokeObjectURL(url); showToast('📥 数据已导出！');
            }

            function importDataPrompt() {
                var input=document.createElement('input');
                input.type='file'; input.accept='.json';
                input.addEventListener('change',function(e){
                    var file=e.target.files[0]; if (!file) return;
                    var reader=new FileReader();
                    reader.onload=function(ev){
                        try {
                            var imported=JSON.parse(ev.target.result);
                            showModal('📤','导入数据','导入将覆盖当前所有数据，确定继续吗？',false,function(){
                                state=Object.assign(getDefaultState(),imported);
                                saveState(); renderAll(); showToast('✅ 数据导入成功！');
                            });
                        } catch(err) { showToast('❌ 文件格式不正确'); }
                    };
                    reader.readAsText(file);
                });
                input.click();
            }

            function showPasswordPrompt(callback) {
                var container=document.getElementById('modalContainer');
                var overlay=document.createElement('div');
                overlay.className='modal-overlay';
                overlay.innerHTML=
                    '<div class="modal">'+
                    '<div class="modal-emoji">🔐</div>'+
                    '<h3>家长验证</h3><p>请输入管理密码</p>'+
                    '<input type="password" class="password-input" id="passwordInput" placeholder="●●●●" maxlength="10" autofocus>'+
                    '<div style="margin-top:16px;">'+
                    '<button class="btn-cancel" id="modalCancel">取消</button>'+
                    '<button class="btn-confirm" id="modalConfirm">确认</button></div>'+
                    '<p style="font-size:10px;color:#ccc;margin-top:8px;">默认密码：2024</p></div>';
                container.appendChild(overlay);
                var close=function(){overlay.remove();};
                var confirm=function(){ var pw=document.getElementById('passwordInput').value; close(); callback(pw); };
                overlay.querySelector('#modalConfirm').addEventListener('click',confirm);
                overlay.querySelector('#modalCancel').addEventListener('click',close);
                overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
                document.getElementById('passwordInput').addEventListener('keydown',function(e){ if(e.key==='Enter') confirm(); });
                setTimeout(function(){ document.getElementById('passwordInput').focus(); },200);
            }

            // ==================== UI辅助 ====================
            function showToast(msg) {
                var container=document.getElementById('toastContainer');
                var toast=document.createElement('div');
                toast.className='toast'; toast.textContent=msg;
                container.appendChild(toast);
                setTimeout(function(){toast.remove();},2200);
            }

            function showConfetti() {
                var container=document.getElementById('confettiContainer');
                var colors=['#ff7b42','#ffb347','#ff6b9d','#4caf84','#5b9bd5','#ffd93d','#9b59b6','#ff4081','#7c4dff'];
                var frag=document.createDocumentFragment();
                for (var i=0; i<50; i++) {
                    var piece=document.createElement('div');
                    piece.className='confetti-piece';
                    piece.style.left=(Math.random()*100)+'%';
                    piece.style.top=-(Math.random()*60+10)+'px';
                    piece.style.background=colors[Math.floor(Math.random()*colors.length)];
                    piece.style.animationDelay=(Math.random()*0.6)+'s';
                    piece.style.animationDuration=(Math.random()*0.8+1)+'s';
                    piece.style.width=(Math.random()*10+6)+'px';

            function showModal(emoji,title,message,autoConfirm,callback) {
                var container=document.getElementById('modalContainer');
                var overlay=document.createElement('div');
                overlay.className='modal-overlay';
                overlay.innerHTML=
                    '<div class="modal"><div class="modal-emoji">'+emoji+'</div>'+
                    '<h3>'+title+'</h3><p>'+message+'</p><div>'+
                    (autoConfirm?'':'<button class="btn-cancel" id="modalCancel">取消</button>')+
                    '<button class="btn-confirm" id="modalConfirm">'+(autoConfirm?'太棒了！':'确认')+'</button></div></div>';
                container.appendChild(overlay);
                var close=function(){overlay.remove();};
                overlay.querySelector('#modalConfirm').addEventListener('click',function(){close(); if(callback) callback();});
                var cancel=overlay.querySelector('#modalCancel');
                if (cancel) cancel.addEventListener('click',close);
                overlay.addEventListener('click',function(e){if(e.target===overlay) close();});
            }

            // ==================== 事件委托（核心绑定）====================
            function setupGlobalEventDelegation() {
                var app=document.querySelector('.app-container');

                app.addEventListener('click', function(e) {
                    // 删除任务
                    var delTask=e.target.closest('.task-card .delete-btn');
                    if (delTask) {
                        var tc=delTask.closest('.task-card');
                        if (tc && tc.dataset.taskId) {
                            var t=getAllTasks().find(function(x){return x.id===tc.dataset.taskId;});
                            if (t) deleteTask(t);
                        }
                        return;
                    }
                    // 删除奖励
                    var delRw=e.target.closest('.reward-card .delete-btn');
                    if (delRw) {
                        var rc=delRw.closest('.reward-card');
                        if (rc && rc.dataset.rewardId) {
                            var r=getAllRewards().find(function(x){return x.id===rc.dataset.rewardId;});
                            if (r) deleteReward(r);
                        }
                        return;
                    }
                    // 任务卡片点击
                    var taskCard=e.target.closest('.task-card');
                    if (taskCard && taskCard.dataset.taskId) {
                        var task=getAllTasks().find(function(x){return x.id===taskCard.dataset.taskId;});
                        if (task) toggleTask(task);
                        return;
                    }
                    // 奖励兑换
                    var redeemBtn=e.target.closest('.btn-redeem.available');
                    if (redeemBtn) {
                        var rcard=redeemBtn.closest('.reward-card');
                        if (rcard && rcard.dataset.rewardId) {
                            var rw=getAllRewards().find(function(x){return x.id===rcard.dataset.rewardId;});
                            if (rw) redeemReward(rw);
                        }
                        return;
                    }
                    // 快捷操作
                    var qb=e.target.closest('.quick-action-btn');
                    if (qb && qb.dataset.quick) { quickComplete(qb.dataset.quick); return; }
                    // 添加任务（分类旁+添加）
                    var atb=e.target.closest('.cat-actions[data-add-task]');
                    if (atb) { showAddTaskForm(atb.dataset.addTask); return; }
                    // 添加奖励
                    var arb=e.target.closest('.cat-actions[data-add-reward]');
                    if (arb) { showAddRewardForm(); return; }
                });

                // 选项卡切换
                document.getElementById('mainTabs').addEventListener('click', function(e) {
                    var tabBtn=e.target.closest('.tab-btn');
                    if (!tabBtn) return;
                    var target=tabBtn.dataset.tab;
                    if (target==='admin' && !isAdminMode) { enterAdminMode(); return; }
                    switchToTab(target);
                });

                // 管理员入口
                document.getElementById('adminEntryBtn').addEventListener('click', function(){
                    if (isAdminMode) exitAdminMode(); else enterAdminMode();
                });
                // 退出管理
                document.getElementById('exitAdminBtn').addEventListener('click', exitAdminMode);
                // 重置今日
                document.getElementById('btnResetDay').addEventListener('click', resetDay);
                // 提醒设置
                document.getElementById('reminderToggle').addEventListener('change', toggleReminder);
                document.getElementById('reminderTimeInput').addEventListener('change', updateReminderTime);
                document.getElementById('btnTestReminder').addEventListener('click', testReminder);
                document.getElementById('btnRequestNotification').addEventListener('click', requestNotificationPermission);
                // 添加任务/奖励
                document.getElementById('btnAddTask').addEventListener('click', addCustomTask);
                document.getElementById('btnAddReward').addEventListener('click', addCustomReward);
                // 积分调整
                document.getElementById('btnAddPoints').addEventListener('click', function(){adjustPoints(1);});
                document.getElementById('btnSubPoints').addEventListener('click', function(){adjustPoints(-1);});
                // 数据管理
                document.getElementById('btnExportData').addEventListener('click', exportData);
                document.getElementById('btnImportData').addEventListener('click', importDataPrompt);
                document.getElementById('btnResetAll').addEventListener('click', resetAll);

                // 吉祥物长按进入管理模式
                var pressTimer;
                var mascot=document.getElementById('mascotIcon');
                mascot.addEventListener('pointerdown', function(){
                    pressTimer=setTimeout(function(){ if(!isAdminMode) enterAdminMode(); }, 2000);
                });
                mascot.addEventListener('pointerup', function(){clearTimeout(pressTimer);});
                mascot.addEventListener('pointerleave', function(){clearTimeout(pressTimer);});
            }

            // ==================== 初始化 ====================
            function init() {
                state = loadState();
                setupGlobalEventDelegation();
                renderAll();
                if (state.reminderEnabled) startReminderCheck();
                // 每分钟检查日期变化
                setInterval(function(){
                    if (state.todayDate !== getDateStr()) { checkNewDay(); renderAll(); showToast('🌅 新的一天，继续加油！'); }
                }, 60000);
                // 每30秒更新提醒条
                setInterval(updateReminderBar, 30000);
            }

            init();
        })();
    </script>
</body>
</html>
